name: Deploy Prod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_DIR: infra/environments/prod
  HEALTH_URL: https://tm-prod.devopsbyhassan.com

jobs:
  terraform:
    name: Terraform Deploy Prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::600929978069:role/github-actions-memos
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -var="image_tag=${{ github.sha }}" -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Wait for service to stabilise
        run: sleep 60

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.HEALTH_URL }})
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"

      - name: Job summary
        run: |
          echo "## Prod Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** prod" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ env.HEALTH_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health check:** Passed ✅" >> $GITHUB_STEP_SUMMARY
