name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to plan'
        required: true
        type: choice
        options: [dev, staging, prod]
        default: prod
  workflow_run:
    workflows: ["Build and Push Image"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    env:
      ENVIRONMENT: ${{ inputs.environment || 'prod' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::600929978069:role/github-actions-memos
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform fmt check
        working-directory: infra/environments/${{ env.ENVIRONMENT }}
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        working-directory: infra/environments/${{ env.ENVIRONMENT }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/environments/${{ env.ENVIRONMENT }}
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/environments/${{ env.ENVIRONMENT }}
        run: terraform plan -input=false -var="image_tag=${{ github.sha }}" -out=tfplan

      - name: Job summary
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY